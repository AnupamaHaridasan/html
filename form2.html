<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Job Application Form</h1>
        <fieldset>

       
        <legend> personal information</legend>
     
        <label>Full Name:</label><br>
        <input type="text"><br>
        <label>Email:</label><br>
        <input type="email"><br>
        <label>Phone:</label><br>
        <input type="tel" maxlength="10"><br>
         </fieldset><br>
        <fieldset>
    
        <legend>Application Details</legend>

        <label>Position Applied for:</label>
        
        <select>
            <option>Developer</option>
            <option>Designer</option>
            <option>Management</option>
        </select><br><br>
        <label>Experience:</label><br>
        <input type="radio" name="Fresher">Fresher<br>
        <input type="radio" name="1-3 years">1-3 years<br>
        <input type="radio" name="3+ years">3+ years<br>
        <label>Upload resume(pdf only):</label>
        <input type="file"><br><br>
        <label>Cover letter</label><br>
        <textarea cols="11" rows="10" placeholder="Tell us about why you're a great fit..."></textarea>
        </fieldset><br>
        <button>Submit Application</button>
    </form>
</body>
</html>
